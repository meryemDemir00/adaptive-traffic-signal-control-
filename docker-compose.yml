services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "29092:29092"   # Windows'tan (SUMO/producer) erişim için
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xmx128m' /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 20s
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in $$KAFKA_TOPIC_RAW $$KAFKA_TOPIC_METRICS $$KAFKA_TOPIC_CONTROL; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1
        done
    environment:
      KAFKA_HEAP_OPTS: "-Xmx128m"
      KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_RAW}
      KAFKA_TOPIC_METRICS: ${KAFKA_TOPIC_METRICS}
      KAFKA_TOPIC_CONTROL: ${KAFKA_TOPIC_CONTROL}
    restart: "no"
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 1g

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
    mem_limit: 384m

  spark:
    build: ./services/spark_job
    container_name: spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_RAW}
      KAFKA_TOPIC_METRICS: ${KAFKA_TOPIC_METRICS}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      SPARK_WINDOW_SECONDS: ${SPARK_WINDOW_SECONDS}
      SPARK_WATERMARK_SECONDS: ${SPARK_WATERMARK_SECONDS:-2}
      SPARK_STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:-latest}
    volumes:
      - ./services/spark_job/job.py:/app/job.py:ro
      - spark_ivy:/tmp/.ivy
    command: >
      /opt/spark/bin/spark-submit
      --master local[2]
      --driver-memory 1g
      --conf spark.jars.ivy=/tmp/.ivy
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.8
      /app/job.py
    mem_limit: 1800m
    restart: unless-stopped
volumes:
  clickhouse_data:
  grafana_data:
  spark_ivy: