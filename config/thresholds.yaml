# Esikler: sabit zamanli, normal senaryo baseline kosusundan (avg_queue) hesaplandi.
# low/medium siniri = P50, high girisi = P85, high cikisi = 0.8 * P85.
# Baseline 3 seed ile tekrarlaninca bu degerler guncellenecek.
metric: avg_queue
exit_ratio: 0.8
dominance_ratio: 1.5   # ana/yan kuyruk orani bu degeri asarsa oncelikli program secilir
programs:
  default: "0"
  main_priority: "1"
  side_priority: "2"
intersections:
  B0:
    medium: 5.1
    high: 10.6
  C0:
    medium: 6.1
    high: 15.8
  C1:
    medium: 3.3
    high: 10.6